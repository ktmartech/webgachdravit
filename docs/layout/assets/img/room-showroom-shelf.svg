<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Showroom Ambient Gradient -->
    <linearGradient id="sr-ambient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Warm Spotlight 3000K Cones -->
    <linearGradient id="warm-spotlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FDE68A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FAF5FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Floor Reflection Gradient -->
    <linearGradient id="sr-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="sr-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B192C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Interior Background -->
  <rect width="400" height="260" fill="url(#sr-ambient)"/>
  <rect y="260" width="400" height="140" fill="url(#sr-floor)"/>
  <line x1="0" y1="260" x2="400" y2="260" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Floor Perspective Grid -->
  <g stroke="#94A3B8" stroke-width="1" opacity="0.6">
    <line x1="0" y1="310" x2="400" y2="310"/>
    <line x1="0" y1="365" x2="400" y2="365"/>
    <line x1="60" y1="260" x2="0" y2="400"/>
    <line x1="160" y1="260" x2="110" y2="400"/>
    <line x1="260" y1="260" x2="270" y2="400"/>
    <line x1="360" y1="260" x2="390" y2="400"/>
  </g>

  <!-- Black Architectural Track Light Rail at Ceiling -->
  <rect x="30" y="24" width="340" height="6" fill="#083A4F" rx="2"/>
  
  <circle cx="90" cy="30" r="5" fill="#0D9488"/>
  <circle cx="200" cy="30" r="5" fill="#0D9488"/>
  <circle cx="310" cy="30" r="5" fill="#0D9488"/>

  <!-- Warm 3000K Light Cones -->
  <polygon points="90,30 35,260 145,260" fill="url(#warm-spotlight)"/>
  <polygon points="200,30 145,260 255,260" fill="url(#warm-spotlight)"/>
  <polygon points="310,30 255,260 365,260" fill="url(#warm-spotlight)"/>

  <!-- Sliding Tile Panels -->
  <g id="tile-panels" filter="url(#sr-shadow)">
    <g transform="translate(45, 60)">
      <rect width="85" height="185" rx="3" fill="#FFFFFF" stroke="#083A4F" stroke-width="2"/>
      <path d="M10,30 C30,50 40,80 75,110" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M20,130 C45,150 60,140 80,170" stroke="#94A3B8" stroke-width="1.5" fill="none" opacity="0.6"/>
      <rect x="35" y="-12" width="15" height="12" fill="#386172"/>
      <circle cx="42" cy="-6" r="3" fill="#F59E0B"/>
    </g>

    <g transform="translate(155, 50)">
      <rect width="90" height="195" rx="3" fill="#D4A373" stroke="#083A4F" stroke-width="2.5"/>
      <line x1="0" y1="65" x2="90" y2="65" stroke="#9C6644" stroke-width="1.5"/>
      <line x1="0" y1="130" x2="90" y2="130" stroke="#9C6644" stroke-width="1.5"/>
      <path d="M15,10 C35,25 25,45 40,60" stroke="#B07D62" stroke-width="1.2" fill="none"/>
      <path d="M50,80 C70,95 60,115 80,125" stroke="#B07D62" stroke-width="1.2" fill="none"/>
      <rect x="38" y="-14" width="15" height="14" fill="#083A4F"/>
      <circle cx="45.5" cy="-7" r="3.5" fill="#F59E0B"/>
    </g>

    <g transform="translate(270, 60)">
      <rect width="85" height="185" rx="3" fill="#CBD5E1" stroke="#083A4F" stroke-width="2"/>
      <circle cx="25" cy="40" r="3" fill="#083A4F" opacity="0.7"/>
      <circle cx="55" cy="65" r="2.5" fill="#F59E0B" opacity="0.8"/>
      <circle cx="35" cy="110" r="3.5" fill="#FFFFFF"/>
      <circle cx="65" cy="140" r="2" fill="#083A4F" opacity="0.6"/>
      <circle cx="20" cy="160" r="3" fill="#0D9488" opacity="0.7"/>
      <rect x="35" y="-12" width="15" height="12" fill="#386172"/>
      <circle cx="42" cy="-6" r="3" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Foreground Consultation Table with Tile Swatches -->
  <g transform="translate(100, 275)" filter="url(#sr-shadow)">
    <ellipse cx="100" cy="25" rx="90" ry="22" fill="#FFFFFF" stroke="#083A4F" stroke-width="2"/>
    <line x1="40" y1="35" x2="30" y2="90" stroke="#083A4F" stroke-width="4"/>
    <line x1="160" y1="35" x2="170" y2="90" stroke="#083A4F" stroke-width="4"/>
    <rect x="55" y="16" width="24" height="16" rx="2" fill="#F59E0B" stroke="#083A4F" stroke-width="1" transform="rotate(-8 55 16)"/>
    <rect x="88" y="14" width="24" height="16" rx="2" fill="#0D9488" stroke="#083A4F" stroke-width="1" transform="rotate(5 88 14)"/>
    <rect x="120" y="18" width="24" height="16" rx="2" fill="#083A4F" stroke="#E2E8F0" stroke-width="1" transform="rotate(15 120 18)"/>
  </g>
</svg>
