<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Wall & Ceiling Gradients -->
    <linearGradient id="wall-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFBFD"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Warm Sunlight Beam -->
    <linearGradient id="sunlight-beam" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FDE68A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Porcelain Floor Gradient with High Gloss Reflection -->
    <linearGradient id="porcelain-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Floor Gloss Reflection Sheen -->
    <linearGradient id="floor-gloss" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#FEF3C7" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0"/>
    </linearGradient>

    <!-- Window Light Scenery -->
    <linearGradient id="sky-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="furniture-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="10" dy="24" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Architectural Background Wall (Off-white / Alabaster) -->
  <rect width="1200" height="460" fill="url(#wall-gradient)"/>

  <!-- Vertical 60x120 Wall Panels Grout Lines (Thin 1px Architectural Precision) -->
  <g stroke="#CBD5E1" stroke-width="1.2" opacity="0.8">
    <line x1="200" y1="0" x2="200" y2="460"/>
    <line x1="420" y1="0" x2="420" y2="460"/>
    <line x1="640" y1="0" x2="640" y2="460"/>
    <line x1="860" y1="0" x2="860" y2="460"/>
    <!-- Subtle horizontal seam -->
    <line x1="0" y1="230" x2="860" y2="230" stroke-dasharray="6 4" opacity="0.4"/>
  </g>

  <!-- Modern Floor-to-Ceiling Slimline Architectural Window (Right Side) -->
  <g id="window-zone">
    <!-- Outdoor Sky & Soft Greenery View -->
    <rect x="880" y="30" width="290" height="420" fill="url(#sky-light)" rx="4"/>
    <circle cx="1060" cy="400" r="140" fill="#BBF7D0" opacity="0.35"/>
    <circle cx="950" cy="420" r="90" fill="#86EFAC" opacity="0.25"/>
    <circle cx="1130" cy="380" r="80" fill="#4ADE80" opacity="0.2"/>

    <!-- Black Architectural Window Frames -->
    <rect x="880" y="30" width="290" height="420" fill="none" stroke="#083A4F" stroke-width="6" rx="4"/>
    <line x1="1025" y1="30" x2="1025" y2="450" stroke="#083A4F" stroke-width="4"/>
    <line x1="880" y1="240" x2="1170" y2="240" stroke="#083A4F" stroke-width="3"/>
  </g>

  <!-- Warm Natural Sunlight Streaming Into Living Room -->
  <polygon points="880,30 1170,30 1200,800 650,800 620,460" fill="url(#sunlight-beam)"/>

  <!-- High-Gloss 80x80 Calacatta Porcelain Floor with 3D Perspective -->
  <polygon points="0,460 1200,460 1200,800 0,800" fill="url(#porcelain-surface)"/>

  <!-- Polished Floor Gloss Highlight Beam -->
  <polygon points="620,460 1170,460 1200,800 520,800" fill="url(#floor-gloss)"/>

  <!-- Architectural 1.5mm Grout-Line Grid on Floor -->
  <g stroke="#94A3B8" stroke-width="1.5" opacity="0.75">
    <!-- Skirting board / Floor joint line -->
    <line x1="0" y1="460" x2="1200" y2="460" stroke="#083A4F" stroke-width="2.5" opacity="0.9"/>
    <!-- Transverse horizontal grout lines in perspective -->
    <line x1="0" y1="515" x2="1200" y2="515"/>
    <line x1="0" y1="585" x2="1200" y2="585"/>
    <line x1="0" y1="675" x2="1200" y2="675"/>
    <line x1="0" y1="785" x2="1200" y2="785"/>

    <!-- Vanishing lines -->
    <line x1="120" y1="460" x2="-40" y2="800"/>
    <line x1="310" y1="460" x2="200" y2="800"/>
    <line x1="500" y1="460" x2="450" y2="800"/>
    <line x1="690" y1="460" x2="710" y2="800"/>
    <line x1="880" y1="460" x2="970" y2="800"/>
    <line x1="1070" y1="460" x2="1230" y2="800"/>
  </g>

  <!-- Luxurious Calacatta Marble Veining (Gold & Soft Charcoal veins) -->
  <g fill="none">
    <path d="M220,530 C270,545 310,535 370,560 C420,580 460,570 510,610" stroke="#D97706" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M680,480 C740,510 790,490 850,540 C910,590 980,570 1060,630" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.4"/>
    <path d="M460,690 C560,710 630,680 720,740 C780,780 840,770 920,800" stroke="#D97706" stroke-width="3.5" stroke-opacity="0.3"/>
    <path d="M100,600 C180,630 240,610 320,660" stroke="#94A3B8" stroke-width="2" stroke-opacity="0.35"/>
  </g>

  <!-- Architectural Furniture: Modern Lounge Setting positioned in open right area -->
  <g id="furniture-setting" filter="url(#furniture-shadow)">
    <!-- Contemporary Cream Boucle Armchair -->
    <g transform="translate(820, 320)">
      <path d="M40,50 C40,20 80,0 120,0 C160,0 200,20 200,50 L195,140 C195,150 185,160 175,160 L65,160 C55,160 45,150 45,140 Z" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
      <path d="M55,55 C70,25 100,15 120,15 C140,15 170,25 185,55 L180,135 L60,135 Z" fill="#FAF9F5"/>
      <rect x="35" y="115" width="170" height="55" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Legs -->
      <line x1="50" y1="165" x2="35" y2="200" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
      <line x1="185" y1="165" x2="200" y2="200" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
      <line x1="38" y1="192" x2="35" y2="200" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
      <line x1="197" y1="192" x2="200" y2="200" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Low Round Marble Coffee Table -->
    <g transform="translate(710, 480)">
      <ellipse cx="65" cy="48" rx="65" ry="14" fill="#0F172A" opacity="0.10"/>
      <line x1="65" y1="15" x2="35" y2="44" stroke="#083A4F" stroke-width="2.5"/>
      <line x1="65" y1="15" x2="95" y2="44" stroke="#083A4F" stroke-width="2.5"/>
      <ellipse cx="65" cy="15" rx="60" ry="15" fill="#F8FAFC" stroke="#F59E0B" stroke-width="1.5"/>
      <ellipse cx="65" cy="14" rx="56" ry="13" fill="#FFFFFF"/>
    </g>

    <!-- Potted Architectural Fiddle Leaf Fig Plant -->
    <g transform="translate(1100, 310)">
      <path d="M12,110 L22,175 C23,180 32,185 40,185 C48,185 57,180 58,175 L68,110 Z" fill="#FAF9F5" stroke="#CBD5E1" stroke-width="2"/>
      <ellipse cx="40" cy="110" rx="28" ry="8" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
      <path d="M40,110 Q42,50 35,20" stroke="#14532D" stroke-width="4" fill="none"/>
      <path d="M35,20 C10,25 0,60 25,75 C35,60 38,40 35,20 Z" fill="#15803D"/>
      <path d="M38,45 C60,40 75,70 55,90 C45,75 42,60 38,45 Z" fill="#16A34A"/>
      <path d="M36,75 C15,80 10,110 32,115 C38,105 38,90 36,75 Z" fill="#22C55E"/>
    </g>
  </g>

  <!-- Subtle sparkle on polished tiles -->
  <g fill="#F59E0B" opacity="0.6">
    <circle cx="820" cy="520" r="2"/>
    <circle cx="980" cy="560" r="1.8"/>
  </g>
</svg>
