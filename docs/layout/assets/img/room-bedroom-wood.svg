<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bed-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2F3"/>
      <stop offset="100%" stop-color="#DCE3E6"/>
    </linearGradient>
    <linearGradient id="bed-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B68856"/>
      <stop offset="100%" stop-color="#C89D6C"/>
    </linearGradient>
  </defs>
  <!-- Bedroom wall with headboard panel -->
  <rect width="800" height="340" fill="url(#bed-wall)"/>
  <rect x="200" y="90" width="400" height="200" rx="4" fill="#386172"/>
  <rect x="215" y="105" width="370" height="170" rx="3" fill="#083A4F"/>
  <!-- Pendant lights -->
  <line x1="150" y1="0" x2="150" y2="120" stroke="#083A4F" stroke-width="2"/>
  <circle cx="150" cy="132" r="14" fill="#F59E0B" opacity="0.85"/>
  <line x1="650" y1="0" x2="650" y2="120" stroke="#083A4F" stroke-width="2"/>
  <circle cx="650" cy="132" r="14" fill="#F59E0B" opacity="0.85"/>
  <!-- Bed -->
  <rect x="230" y="250" width="340" height="80" rx="6" fill="#F8FAFC"/>
  <rect x="230" y="300" width="340" height="40" rx="4" fill="#E2E8F0"/>
  <rect x="250" y="232" width="130" height="34" rx="6" fill="#FFFFFF"/>
  <rect x="420" y="232" width="130" height="34" rx="6" fill="#FFFFFF"/>
  <!-- 15x90 wood plank floor in perspective -->
  <polygon points="0,340 800,340 800,600 0,600" fill="url(#bed-floor)"/>
  <g stroke="#7A542E" stroke-width="1.5" stroke-opacity="0.7">
    <line x1="0" y1="340" x2="800" y2="340" stroke="#083A4F" stroke-width="2" stroke-opacity="1"/>
    <line x1="100" y1="340" x2="-60" y2="600"/>
    <line x1="200" y1="340" x2="90" y2="600"/>
    <line x1="300" y1="340" x2="240" y2="600"/>
    <line x1="400" y1="340" x2="400" y2="600"/>
    <line x1="500" y1="340" x2="560" y2="600"/>
    <line x1="600" y1="340" x2="710" y2="600"/>
    <line x1="700" y1="340" x2="860" y2="600"/>
    <line x1="40" y1="410" x2="180" y2="410"/>
    <line x1="330" y1="460" x2="470" y2="460"/>
    <line x1="560" y1="520" x2="700" y2="520"/>
    <line x1="150" y1="550" x2="290" y2="550"/>
  </g>
</svg>

