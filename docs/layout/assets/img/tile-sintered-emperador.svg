<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Dark Luxury Sintered Stone Texture -->
    <linearGradient id="slab-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glossy Reflection Sheen across the Slab -->
    <linearGradient id="slab-sheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold Accent Vein Gradient -->
    <linearGradient id="gold-vein" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="slab-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="16" stdDeviation="16" flood-color="#0B192C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Clean Subtle Background -->
  <rect width="400" height="400" fill="#F8FAFC" rx="8"/>
  <rect width="400" height="400" fill="none" stroke="#E2E8F0" stroke-width="1.5" rx="8"/>

  <!-- 3D Perspective Sintered Stone Big Slab 120x240 -->
  <g transform="translate(45, 30)" filter="url(#slab-shadow)">
    <!-- 3D Thickness Edge (9mm profile) -->
    <polygon points="55,305 255,335 255,347 55,317" fill="#08171E"/>
    <polygon points="255,335 295,75 305,75 265,347" fill="#1E293B"/>

    <!-- Main Front Face of Sintered Slab -->
    <polygon points="95,45 295,75 255,335 55,305" fill="url(#slab-surface)" stroke="#386172" stroke-width="1"/>

    <!-- Polished Gloss Sheen Overlay -->
    <polygon points="95,45 295,75 255,335 55,305" fill="url(#slab-sheen)"/>

    <!-- Golden Liquid Veins (Bookmatch Style) -->
    <g fill="none">
      <path d="M125,50 C160,95 210,135 190,190 C175,230 215,265 240,320" stroke="url(#gold-vein)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M127,51 C162,96 212,136 192,191 C177,231 217,266 242,321" stroke="#FEF3C7" stroke-width="1.2" stroke-opacity="0.8"/>
      <path d="M185,150 C140,170 110,210 85,255" stroke="url(#gold-vein)" stroke-width="2"/>
      <path d="M210,240 C240,230 260,210 280,215" stroke="url(#gold-vein)" stroke-width="1.8"/>
      <path d="M140,70 C190,120 250,150 270,120" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.4"/>
      <path d="M75,270 C120,285 160,265 200,295" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.4"/>
    </g>

    <!-- Corner Spec Badge -->
    <g transform="translate(68, 55)">
      <rect width="64" height="20" rx="3" fill="#0D9488"/>
      <text x="32" y="14" fill="#FFFFFF" font-family="'Quicksand', sans-serif" font-size="10" font-weight="700" text-anchor="middle">120x240</text>
    </g>

    <g transform="translate(190, 290)">
      <rect width="52" height="18" rx="3" fill="#F59E0B"/>
      <text x="26" y="13" fill="#083A4F" font-family="'Quicksand', sans-serif" font-size="9" font-weight="700" text-anchor="middle">9mm SLIM</text>
    </g>
  </g>
</svg>
