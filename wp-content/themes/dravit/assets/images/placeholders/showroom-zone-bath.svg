<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Showroom zone: bathroom & garden mock-up booths -->
  <rect width="800" height="600" fill="#0B4A64"/>
  <rect x="60" y="24" width="680" height="8" fill="#9CB0B9"/>
  <!-- Booth 1: bathroom 30x60 wall + R10 floor -->
  <rect x="60" y="80" width="320" height="420" fill="#F1F5F9" stroke="#CDD8DB" stroke-width="3"/>
  <g stroke="#CBD5E1" stroke-width="1.5">
    <line x1="60" y1="150" x2="380" y2="150"/>
    <line x1="60" y1="220" x2="380" y2="220"/>
    <line x1="60" y1="290" x2="380" y2="290"/>
    <line x1="140" y1="80" x2="140" y2="360"/>
    <line x1="220" y1="80" x2="220" y2="360"/>
    <line x1="300" y1="80" x2="300" y2="360"/>
  </g>
  <rect x="60" y="360" width="320" height="140" fill="#94A3B8"/>
  <rect x="110" y="300" width="120" height="60" rx="8" fill="#FFFFFF"/>
  <rect x="300" y="120" width="8" height="140" fill="#083A4F"/>
  <!-- Booth 2: garden R11 pavers -->
  <rect x="420" y="80" width="320" height="420" fill="#E3EEED" stroke="#CDD8DB" stroke-width="3"/>
  <circle cx="660" cy="210" r="60" fill="#3C7D7C"/>
  <circle cx="610" cy="250" r="38" fill="#2F6664"/>
  <rect x="420" y="330" width="320" height="170" fill="#8A9BA3"/>
  <g stroke="#386172" stroke-width="2">
    <line x1="420" y1="390" x2="740" y2="390"/>
    <line x1="420" y1="450" x2="740" y2="450"/>
    <line x1="500" y1="330" x2="490" y2="500"/>
    <line x1="580" y1="330" x2="580" y2="500"/>
    <line x1="660" y1="330" x2="670" y2="500"/>
  </g>
  <rect x="0" y="520" width="800" height="80" fill="#083A4F"/>
</svg>

