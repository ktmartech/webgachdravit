<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Modern Kitchen with 60x120 Cement Matte Floor & Sintered Stone Island -->
  <rect width="800" height="360" fill="#F5F4F0"/>
  <!-- Kitchen Backsplash Tile Grid -->
  <rect x="60" y="130" width="680" height="100" fill="#E7E2CE" stroke="#CDD8DB" stroke-width="2"/>
  <g stroke="#9CB0B9" stroke-width="1">
    <line x1="145" y1="130" x2="145" y2="230"/>
    <line x1="230" y1="130" x2="230" y2="230"/>
    <line x1="315" y1="130" x2="315" y2="230"/>
    <line x1="400" y1="130" x2="400" y2="230"/>
    <line x1="485" y1="130" x2="485" y2="230"/>
    <line x1="570" y1="130" x2="570" y2="230"/>
    <line x1="655" y1="130" x2="655" y2="230"/>
  </g>
  <!-- Upper & Lower Cabinets -->
  <rect x="60" y="30" width="680" height="100" fill="#083A4F"/>
  <rect x="60" y="230" width="680" height="130" fill="#386172"/>
  <!-- Sintered Stone Kitchen Island -->
  <rect x="170" y="275" width="460" height="125" rx="4" fill="#1E2F38" stroke="#083A4F" stroke-width="3"/>
  <rect x="160" y="265" width="480" height="16" rx="2" fill="#E7E2CE"/>
  <!-- 60x120 Cement Matte Floor -->
  <rect x="0" y="360" width="800" height="240" fill="#CDD8DB"/>
  <g stroke="#6A8994" stroke-width="1.5">
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="435" x2="800" y2="435"/>
    <line x1="0" y1="520" x2="800" y2="520"/>
    <line x1="250" y1="360" x2="160" y2="600"/>
    <line x1="550" y1="360" x2="640" y2="600"/>
  </g>
</svg>

